# .github/workflows/build.yml
name: Build Proton

on:
  push: {}            
  pull_request: {}    
  workflow_dispatch:  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (shallow, no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1        # only the latest commit
          submodules: false     # skip submodules for now

      - name: Override wine submodule URL
        run: |
          git config submodule.wine.url https://github.com/Etaash-mathamsetty/wine-valve.git

      - name: Init & shallow‐clone submodules
        run: |
          git submodule update --init --recursive --depth 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd.io
          sudo apt-get install -y docker.io docker-compose build-essential rsync
          sudo service docker start
          sudo gpasswd -a $USER docker

      - name: Build Proton
        run: make proton

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-dist
          path: build/build-em-10-local/dist/files/
