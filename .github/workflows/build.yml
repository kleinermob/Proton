# .github/workflows/build.yml
name: Build Proton

on:
  push: {}            # any push (all branches)
  pull_request: {}    # any PR (all branches)
  workflow_dispatch:  # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Override wine submodule URL
        run: |
          git config submodule.wine.url https://github.com/Etaash-mathamsetty/wine-valve.git

      - name: Init and update submodules
        run: git submodule update --init --recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync docker.io

      - name: Build Proton
        run: make proton

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-dist
          path: build/build-em-10-local/dist/files/
